name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Validate scripts exist before running jobs
  validate:
    name: Validate CI Scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - name: Validate package.json scripts exist
        run: |
          REQUIRED_SCRIPTS="lint format:check type-check test test:coverage build"
          for script in $REQUIRED_SCRIPTS; do
            if ! grep -q "\"$script\":" package.json; then
              echo "❌ Missing required script: $script"
              exit 1
            fi
            echo "✅ Script exists: $script"
          done

  # Run type-check and lint first (fail fast)
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: [validate]
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run type-check

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    needs: [validate]
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for commitlint

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: |
          # Use commitlint from package.json dependencies
          # Check all commits in the PR, not just the title
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # Run tests only after type-check and lint pass
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [type-check, lint]
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./extension/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Build only after tests pass
  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: [test]
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Validate required files exist
        run: |
          REQUIRED_FILES="dist/manifest.json dist/background.js dist/content-extractor.js"
          for file in $REQUIRED_FILES; do
            if [ ! -f "$file" ]; then
              echo "❌ Required file not found: $file"
              exit 1
            fi
            echo "✅ File exists: $file"
          done

      - name: Validate manifest.json schema
        run: |
          # Basic manifest validation
          node -e "
            const manifest = require('./dist/manifest.json');
            const required = ['manifest_version', 'name', 'version', 'permissions'];
            const missing = required.filter(k => !manifest[k]);
            if (missing.length > 0) {
              console.error('❌ Missing required manifest fields:', missing);
              process.exit(1);
            }
            if (manifest.manifest_version !== 3) {
              console.error('❌ Must use Manifest V3');
              process.exit(1);
            }
            console.log('✅ Manifest schema valid');
          "

      - name: Check bundle sizes (cross-platform)
        run: |
          # Use Node.js for cross-platform file size checking
          node -e "
            const fs = require('fs');
            const path = require('path');

            // Find popup bundle using fs.readdirSync (no dependencies needed)
            const assetsDir = 'dist/assets';
            const files = fs.readdirSync(assetsDir);
            const popupFiles = files.filter(f => f.startsWith('popup-') && f.endsWith('.js'));

            if (popupFiles.length === 0) {
              console.error('❌ No popup bundle found');
              process.exit(1);
            }

            const popupSize = fs.statSync(path.join(assetsDir, popupFiles[0])).size;
            const bgSize = fs.statSync('dist/background.js').size;

            console.log(\`📦 Popup bundle: \${(popupSize / 1024).toFixed(2)} KB\`);
            console.log(\`📦 Background bundle: \${(bgSize / 1024).toFixed(2)} KB\`);

            // Warn if bundles are too large
            if (popupSize > 512000) {
              console.warn(\`⚠️ Warning: Popup bundle exceeds 500KB (\${(popupSize / 1024).toFixed(2)} KB)\`);
            }

            if (bgSize > 100000) {
              console.warn(\`⚠️ Warning: Background bundle exceeds 100KB (\${(bgSize / 1024).toFixed(2)} KB)\`);
            }
          "

      - name: Validate Zod schemas exist
        run: |
          REQUIRED_SCHEMAS="src/schemas/api.ts src/schemas/chrome.ts src/schemas/index.ts"
          for schema in $REQUIRED_SCHEMAS; do
            if [ ! -f "$schema" ]; then
              echo "❌ Missing required Zod schema: $schema"
              exit 1
            fi
            echo "✅ Schema exists: $schema"
          done

      - name: Validate retry logic implementation
        run: |
          # Check for retry logic with exponential backoff
          if ! grep -r "retryWithBackoff\|exponential.*backoff\|retry.*delay" src/utils/ src/services/; then
            echo "❌ Retry logic with exponential backoff not found"
            exit 1
          fi
          echo "✅ Retry logic implementation found"

      - name: Validate state checkpointing
        run: |
          # Check for state checkpointing implementation
          if [ ! -f "src/services/stateCheckpoint.ts" ]; then
            echo "❌ State checkpointing not implemented"
            exit 1
          fi
          echo "✅ State checkpointing exists"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: extension/dist/
          retention-days: 7

  # Auto-fix workflow - creates commit with fixes
  auto-fix:
    name: Auto-fix Issues
    runs-on: ubuntu-latest
    if: needs.lint.result == 'failure' && github.event_name == 'pull_request'
    needs: [lint]
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for auto-fix loop
        id: loop_check
        run: |
          # Prevent auto-fix loops - check if last commit was by bot
          LAST_AUTHOR=$(git log -1 --format='%an')
          if [[ "$LAST_AUTHOR" == "github-actions[bot]" ]]; then
            echo "⚠️ Last commit was auto-fix - preventing loop"
            echo "is_loop=true" >> $GITHUB_OUTPUT
          else
            echo "is_loop=false" >> $GITHUB_OUTPUT
          fi

      - name: Run auto-fix
        if: steps.loop_check.outputs.is_loop == 'false'
        run: |
          npm run lint -- --fix || true
          npm run format || true

      - name: Check for changes
        if: steps.loop_check.outputs.is_loop == 'false'
        id: changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push fixes
        if: steps.loop_check.outputs.is_loop == 'false' && steps.changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "style: auto-fix linting and formatting issues

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push
